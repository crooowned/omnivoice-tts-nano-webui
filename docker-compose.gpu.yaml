services:
  omnivoice-backend:
    build: ./backend
    container_name: omnivoice-backend
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./voices:/app/voices
      - ./models:/app/models
      - ./logs:/app/logs
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - OMNIVOICE_MODEL=k2-fsa/OmniVoice
      - DEVICE=cuda
      - DTYPE=float16
      - LM_QUANT=nf4  # none, nf4, or int8 — try nf4 to drop ~800MB VRAM
      - LOAD_ASR=false
      - ASR_MODEL=${ASR_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      - ASR_DEVICE=${ASR_DEVICE:-cuda}
      - ASR_MODEL_TTL_SECONDS=${ASR_MODEL_TTL_SECONDS:-300}
      - ASR_CPU_FALLBACK=${ASR_CPU_FALLBACK:-true}
      - ASR_MIN_FREE_GPU_GB=${ASR_MIN_FREE_GPU_GB:-2}
      - MODEL_TTL_SECONDS=3600
      - CHUNK_CHARS=200
      - CHUNK_GAP_MS=${CHUNK_GAP_MS:-150}
      - TURBO_STEPS=${TURBO_STEPS:-4}
      - DYNAMIC_STEPS_MIN=${DYNAMIC_STEPS_MIN:-4}
      - DYNAMIC_STEPS_MAX=${DYNAMIC_STEPS_MAX:-64}
      - DYNAMIC_DESIRED_SPEED=${DYNAMIC_DESIRED_SPEED:-4.0}
      - DYNAMIC_STEP_DELTA=${DYNAMIC_STEP_DELTA:-4}
      - MAX_VRAM_GB=4  # 0 = no limit. If exceeded during inference, request will OOM.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  omnivoice-frontend:
    build: ./frontend
    container_name: omnivoice-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-7863}:${FRONTEND_PORT:-7863}"
    environment:
      - API_URL=http://omnivoice-backend:8883
      - STT_URL=${STT_URL:-}
      - FRONTEND_PORT=${FRONTEND_PORT:-7863}
      - UI_LANG=${UI_LANG:-en}
      - OUTPUTS_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - omnivoice-backend

volumes:
  huggingface_cache:
